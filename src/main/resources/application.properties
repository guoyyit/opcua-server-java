# Local loopback OPC UA server.
# 0 = bind an ephemeral loopback port (tests discover it from the server bean).
opcua.port=0

# Channel/session default timing.
opcua.default-channel-lifetime-ms=60000
opcua.default-session-timeout-ms=60000
opcua.reaper-interval-ms=100

# Resource limits (overridable per test via @SpringBootTest properties).
opcua.max-sessions=64
opcua.max-subscriptions-per-session=16
opcua.max-monitored-items-per-subscription=64
opcua.max-notification-queue-depth=1000
opcua.min-sampling-interval-ms=10
opcua.max-continuation-points=32

spring.main.banner-mode=off
